# Plano FREE: sem `disk` (disco persistente exige plano pago), o disco é apagado a cada deploy.
# Por isso as fotos dos produtos ficam no Postgres (tabela `imagens`), servidas em /imagens/<id>.
services:
  - type: web
    name: nix-glasses
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Admin: sem estas variáveis as rotas admin respondem 503 (fail closed).
      # Gere o hash com: node scripts/generate-admin-hash.js "sua-senha-forte"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Várias empresas no mesmo serviço: veja .env.example (EMPRESAS e EMPRESA_<SLUG>_*).
      - key: EMPRESAS
        sync: false
