# Plano FREE: sem `disk` (disco persistente exige plano pago).
# Uploads em /uploads serão efêmeros (apagados a cada restart/redeploy).
# Para persistir imagens no Free, use S3/Cloudinary no futuro.
services:
  - type: web
    name: nix-glasses
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
