<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-loja="nome" data-loja-sufixo=" - Acerto de Maletas">Nix Glasses - Acerto de Maletas</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e17;
      --bg-secondary: #111827;
      --fg: #f0f4f8;
      --muted: #6b7c93;
      --accent: #00d4aa;
      --warning: #f59e0b;
      --card: #1a2235;
      --border: #2a3a5a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    .glass-panel {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-btn {
      transition: all 0.2s ease;
    }

    .card-hover {
      transition: all 0.2s ease;
    }

    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .check-input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      border: 2px solid currentColor;
      display: inline-block;
      position: relative;
      flex-shrink: 0;
    }

    .check-input.checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 8px;
      border: solid var(--fg);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .check-input {
        width: 16px;
        height: 16px;
      }
      .check-input.checked::after {
        left: 4px;
        top: 1px;
        border-width: 0 2px 2px 0;
      }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-[rgba(10,14,23,0.8)] backdrop-blur-xl border-b border-[var(--border)]">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="/logo.png" alt="NIX" class="h-10 w-auto" onerror="this.remove()">
        <span data-loja="nome" class="text-xl font-bold tracking-tight">Nix Glasses</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-sm text-[var(--muted)]">Acerto de Maletas</span>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="pt-20 padding">

    <!-- Product Search -->
    <div class="glass-panel rounded-2xl p-6 mb-8 fade-in" style="animation-delay: 0.1s;">
      <h2 class="text-lg font-semibold mb-6">Seleção de Produtos Condicionais</h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- Search Container -->
        <div>
          <label class="block text-sm font-medium mb-2">Buscar Produto</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[var(--muted)]">Nome ou SKU</span>
            <input type="text" id="product-search" placeholder="Digite para buscar..." 
                   class="w-full pl-10 rounded-lg bg-[var(--bg-secondary)] border border-[var(--border)] py-3 px-4 text-sm focus:outline-none focus:border-[var(--accent)] transition-colors">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Status</label>
          <select id="product-status" class="w-full rounded-lg bg-[var(--bg-secondary)] border border-[var(--border)] px-4 py-3 text-sm focus:outline-none focus:border-[var(--accent)] transition-colors">
            <option value="">Todos</option>
            <option value="CONDICIONAL">CONDICIONAL</option>
            <option value="DISPONIVEL">DISPONIVEL</option>
            <option value="ESGOTADO">ESGOTADO</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2"></label>
          <button id="refresh-products" class="w-full rounded-lg bg-[var(--accent)] text-white font-medium py-2 px-4 text-sm hover:opacity-90 transition-opacity">
            Atualizar Lista
          </button>
        </div>
      </div>

      <!-- Products Checklist -->
      <div id="products-checklist" class="mt-6 max-h-96 overflow-y-auto">
        <!-- Products will be rendered here -->
        <p class="text-[var(--muted)] py-8 text-center">Carregando produtos...</p>
      </div>

      <!-- Finish Accert Section -->
      <div id="finish-section" class="mt-8 pt-6 border-t border-[var(--border)] hidden">
        <h3 class="text-lg font-semibold mb-4">Finalizar Acerto</h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
          <div>
            <label class="block text-sm font-medium mb-2">Marcados</label>
            <p id="selected-count" class="text-sm text-[var(--muted)]">0 selecionados</p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Resultado</label>
            <p id="total-count" class="text-sm text-[var(--muted)]">0 itens</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Observações</label>
          <textarea id="observations" rows="3" class="w-full rounded-lg bg-[var(--bg-secondary)] border border-[var(--border)] px-4 py-3 text-sm resize-none focus:outline-none focus:border-[var(--accent)] transition-colors" placeholder="Observações sobre o acerto..."></textarea>
        </div>

        <button id="finish-acerto" class="w-full rounded-lg bg-gradient-to-r from-[var(--error)] to-red-600 text-white font-medium py-3 px-6 mt-4 hover:opacity-90 transition-opacity">
          Finalizar Acerto
        </button>
      </div>
    </div>

  </main>

  <script>
    // API Base URL - relativo para funcionar em localhost e no Render
    const API_BASE = '';

    // State
    let allProducts = [];
    let filteredProducts = [];

    // DOM Elements
    const productSearch = document.getElementById('product-search');
    const productStatus = document.getElementById('product-status');
    const refreshProducts = document.getElementById('refresh-products');
    const productsChecklist = document.getElementById('products-checklist');
    const finishSection = document.getElementById('finish-section');
    const finishAcerto = document.getElementById('finish-acerto');
    const selectedCount = document.getElementById('selected-count');
    const totalCount = document.getElementById('total-count');
    const observations = document.getElementById('observations');

    // Auth admin: token JWT em localStorage (obtido em ./login.html)
    function authHeaders(extra = {}) {
      const t = localStorage.getItem('nix_admin_token');
      return t ? { ...extra, Authorization: 'Bearer ' + t } : extra;
    }
    async function fetchAdmin(url, opts = {}) {
      opts.headers = authHeaders(opts.headers || {});
      const res = await fetch(url, opts);
      if (res.status === 401) {
        localStorage.removeItem('nix_admin_token');
        window.location.href = './login.html?next=' + encodeURIComponent(window.location.pathname);
        throw new Error('Sessão expirada. Faça login novamente.');
      }
      return res;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      // Sempre exige login: sem token, vai para a tela de login
      if (!localStorage.getItem('nix_admin_token')) {
        window.location.href = './login.html?next=' + encodeURIComponent(window.location.pathname);
        return;
      }
      fetchConditionalProducts();
      setupEventListeners();
    });

    // Setup Event Listeners
    function setupEventListeners() {
      productSearch.addEventListener('input', filterProducts);
      productStatus.addEventListener('change', filterProducts);
      refreshProducts.addEventListener('click', fetchConditionalProducts);
      finishAcerto.addEventListener('click', handleFinishAcerto);
    }

    // Fetch Conditional Products
    async function fetchConditionalProducts() {
      try {
        const response = await fetchAdmin(`${API_BASE}/api/admin/products/conditional`);
        if (!response.ok) throw new Error('Failed to fetch conditional products');
        allProducts = await response.json();
        pruneChecklist();
        filterProducts();
      } catch (error) {
        console.error('Error fetching conditional products:', error);
        productsChecklist.innerHTML = '<p class="text-[var(--error)] py-8 text-center">Erro ao carregar produtos</p>';
      }
    }

    function escapeHtml(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Estado do checklist em localStorage: [{ id, sku, bought, returned }].
    // Itens que saíram de CONDICIONAL (acertados em outra tela, por exemplo)
    // são descartados para não serem reenviados.
    function loadChecklist() {
      try {
        const saved = JSON.parse(localStorage.getItem('acerto-checklist') || '[]');
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveChecklist(saved) {
      localStorage.setItem('acerto-checklist', JSON.stringify(saved));
    }

    function pruneChecklist() {
      const ids = new Set(allProducts.map(p => p.id));
      saveChecklist(loadChecklist().filter(s => ids.has(s.id) && (s.bought || s.returned)));
    }

    // Render Products Checklist
    function renderProductsChecklist() {
      if (filteredProducts.length === 0) {
        productsChecklist.innerHTML = `
          <div class="py-12 text-center text-[var(--muted)]">
            <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13A11.953 11.953 0 0112 2.253m0 13a9.958 9.958 0 00-9 10m9-10a9.953 9.953 0 01-9 10m9-10A8 8 0 104 12a8 8 0 00.908-7.971"/>
            </svg>
            <span>Nenhum produto com status CONDICIONAL</span>
          </div>
        `;
        finishSection.classList.toggle('hidden', allProducts.length === 0);
        updateCounts();
        return;
      }

      finishSection.classList.remove('hidden');

      const savedChecks = loadChecklist();

      productsChecklist.innerHTML = filteredProducts.map((product, index) => {
        const productChecks = savedChecks.find(s => s.id === product.id) || { bought: false, returned: false };
        const id = Number(product.id);

        return `
          <div class="glass-panel rounded-xl p-5 mb-3 fade-in" style="animation-delay: ${index * 0.05}s;">
            <div class="flex items-center gap-4">
              <div class="w-10 h-10 rounded-lg bg-[var(--bg-secondary)] flex items-center justify-center flex-shrink-0">
                <span class="text-sm font-medium">${escapeHtml(product.nome.substring(0, 3).toUpperCase())}</span>
              </div>
              <div class="flex-1 min-w-0">
                <p class="font-medium">${escapeHtml(product.nome)}</p>
                <p class="text-xs text-[var(--muted)]">${escapeHtml(product.sku)}</p>
                <p class="text-xs text-[var(--muted)]">Vezes em maleta: ${Number(product.vezesEmMaleta) || 0}</p>
              </div>
              <div class="flex items-center gap-3 flex-shrink-0">
                <label class="flex items-center gap-1 text-sm">
                  <input type="checkbox" class="check-input" data-product-id="${id}" data-action="bought" ${productChecks.bought ? 'checked' : ''}>
                  Comprou
                </label>
                <label class="flex items-center gap-1 text-sm">
                  <input type="checkbox" class="check-input" data-product-id="${id}" data-action="returned" ${productChecks.returned ? 'checked' : ''}>
                  Devolveu
                </label>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Add event listeners to checkboxes
      addCheckboxListeners();

      // Update counts
      updateCounts();
    }

    // Add Checkbox Listeners
    function addCheckboxListeners() {
      const checkboxes = productsChecklist.querySelectorAll('input[type="checkbox"]');

      checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          const id = Number(e.target.dataset.productId);
          const action = e.target.dataset.action;
          const other = action === 'bought' ? 'returned' : 'bought';
          const product = allProducts.find(p => p.id === id);

          let saved = loadChecklist();
          let entry = saved.find(s => s.id === id);
          if (!entry) {
            entry = { id, sku: product ? product.sku : undefined, bought: false, returned: false };
            saved.push(entry);
          }
          entry[action] = e.target.checked;

          // Comprou e Devolveu são excludentes
          if (e.target.checked) {
            entry[other] = false;
            const twin = productsChecklist.querySelector(`input[data-product-id="${id}"][data-action="${other}"]`);
            if (twin) twin.checked = false;
          }

          saved = saved.filter(s => s.bought || s.returned);
          saveChecklist(saved);
          updateCounts();
        });
      });
    }

    // Update Counts
    function updateCounts() {
      const saved = loadChecklist();
      const bought = saved.filter(s => s.bought).length;
      const returned = saved.filter(s => s.returned).length;

      selectedCount.textContent = `${saved.length} de ${allProducts.length} marcados`;
      totalCount.textContent = `${bought} comprado(s) • ${returned} devolvido(s)`;
    }

    // Handle Finish Acerto
    async function handleFinishAcerto() {
      const saved = loadChecklist();

      if (saved.length === 0) {
        alert('Nenhum produto foi marcado como comprado ou devolvido.');
        return;
      }

      if (!confirm(`Deseja finalizar o acerto com ${saved.length} item(ns)?`)) {
        return;
      }

      try {
        const comprados = saved.filter(s => s.bought).map(s => s.id);
        const devolvidos = saved.filter(s => s.returned).map(s => s.id);

        const response = await fetchAdmin(`${API_BASE}/api/admin/acerto`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ comprados, devolvidos, observacoes: observations.value })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || 'Erro ao finalizar acerto');
        }

        const ignorados = (data.ignorados || []).length;
        alert(ignorados
          ? `Acerto finalizado. ${ignorados} item(ns) já não estavam em condicional e foram ignorados.`
          : 'Acerto finalizado com sucesso!');

        // Clear localStorage and refresh
        localStorage.removeItem('acerto-checklist');
        observations.value = '';
        fetchConditionalProducts();

      } catch (error) {
        console.error('Error finishing acerto:', error);
        alert(`Erro ao finalizar acerto: ${error.message}`);
      }
    }

    // Filter Products
    function filterProducts() {
      const searchTerm = productSearch.value.toLowerCase();
      const statusFilter = productStatus.value;

      filteredProducts = allProducts.filter(product => {
        const matchesSearch = product.nome.toLowerCase().includes(searchTerm) || 
                           product.sku.toLowerCase().includes(searchTerm);
        const matchesStatus = !statusFilter || product.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      renderProductsChecklist();
    }
  </script>
</body>
</html>
