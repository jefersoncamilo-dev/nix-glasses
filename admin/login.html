<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nix Glasses - Login Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl border border-gray-200 p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Nix Admin</h1>
    <p class="text-sm text-gray-500 mb-6">Acesso restrito — faça login para continuar.</p>
    <form id="formLogin" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
        <input type="text" id="loginUser" autocomplete="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" id="loginPass" autocomplete="current-password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" required>
      </div>
      <p id="loginErro" class="hidden text-sm text-red-600"></p>
      <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg font-medium transition-colors">Entrar</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('formLogin');
    const erro = document.getElementById('loginErro');

    // Se já tem token válido, vai direto ao painel
    (async () => {
      const token = localStorage.getItem('nix_admin_token');
      if (!token) return;
      try {
        const res = await fetch('/api/admin/produtos', { headers: { Authorization: 'Bearer ' + token } });
        if (res.ok) window.location.href = './index.html';
        else localStorage.removeItem('nix_admin_token');
      } catch {}
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.classList.add('hidden');
      const user = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Falha no login');
        localStorage.setItem('nix_admin_token', data.token);
        const next = new URLSearchParams(window.location.search).get('next') || './index.html';
        window.location.href = next;
      } catch (err) {
        erro.textContent = err.message;
        erro.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
